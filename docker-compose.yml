services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data   # persiste o SQLite fora do container
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3